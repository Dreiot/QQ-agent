<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../visual-refinements.css"></head><body data-panel="sessions"><main id="sessions-panel" aria-busy="true" data-ready="false"><header class="head"><div><div class="eyebrow">RUNTIME / SESSIONS</div><h2>会话流水</h2><div id="meta" class="muted">加载中</div></div><div class="actions"><button id="broadcast">群发测试</button><button id="reload">刷新</button><button id="clear" class="danger">清除终态</button></div></header><div class="toolbar"><input id="search" type="search" placeholder="搜索触发消息或会话" aria-label="搜索会话"><select id="status-filter" aria-label="会话状态"><option value="">全部状态</option><option value="waiting">等待中</option><option value="running">运行中</option><option value="done">已回复</option><option value="noreply">未回复</option><option value="error">失败</option><option value="aborted">已中止</option></select><select id="chat-filter" aria-label="会话聊天"><option value="">全部聊天</option></select><label><input id="follow" type="checkbox" checked disabled>自动跟随运行</label></div><section class="grid"><div><h3 id="list-context" hidden></h3><div id="list" class="list"></div><button id="more" hidden>加载更多</button></div><article id="detail" class="card"><div class="empty">选择一个会话查看详情</div></article></section></main><script type="module" src="panel.js"></script></body></html>
