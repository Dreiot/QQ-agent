<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>插件</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../market-browser.css"><link rel="stylesheet" href="../visual-refinements.css"></head><body data-panel="plugins"><main>
<header class="head"><div><div class="eyebrow">EXTENSIONS / PLUGINS</div><h2>插件</h2><div id="meta" class="muted">加载中</div></div><div class="actions" id="installed-actions"><button id="install">安装插件 ZIP</button><button id="reload">重扫磁盘</button><input id="search" type="search" placeholder="筛选插件" aria-label="筛选插件"></div></header>
<nav class="extension-views" role="tablist" aria-label="插件视图"><button id="tab-installed" type="button" role="tab" aria-selected="true" aria-controls="installed-view">已安装</button><button id="tab-market" type="button" role="tab" aria-selected="false" aria-controls="market-view" tabindex="-1">在线插件市场</button></nav>
<section id="installed-view" role="tabpanel" aria-labelledby="tab-installed"><p id="install-status" class="muted" role="status" aria-live="polite" aria-atomic="true" hidden></p><section id="capability-providers" aria-label="能力提供者"></section><section id="list" class="list"></section></section>
<section id="market-view" role="tabpanel" aria-labelledby="tab-market" hidden><div class="market-toolbar"><label><span class="sr-only">搜索在线插件</span><input id="market-search" type="search" placeholder="搜索名称、说明或作者" aria-label="搜索在线插件"></label><label><span class="sr-only">插件分类</span><select id="market-category" aria-label="插件分类"><option value="">全部分类</option></select></label><button id="market-refresh" type="button">刷新目录</button><button id="open-plugin-market" class="ghost" type="button">市场网页版</button></div><p class="muted market-note">来自 QQ Agent 社区的在线目录。安装后默认停用，请检查来源、设置与权限后启用。</p><p id="plugin-market-status" class="muted market-feedback" role="status" aria-live="polite"></p><p id="market-status" class="muted market-feedback" role="status" aria-live="polite" aria-atomic="true"></p><p id="market-install-status" class="muted market-feedback" role="status" aria-live="polite" aria-atomic="true"></p><div id="market-results" class="market-results"></div></section>
</main><script type="module" src="panel.js"></script></body></html>
