<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用日志</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../visual-refinements.css"></head>
<body data-panel="logs"><main>
  <header class="head"><div><h2>应用日志</h2><p id="status" class="muted" role="status" aria-live="polite">最近 200 条 · 实时更新</p></div><div class="actions">
    <label for="log-level">日志级别</label><select id="log-level" title="只记录所选级别及更严重的事件；仅本次运行有效，重启后恢复默认级别"><option value="debug">调试</option><option value="info" selected>信息</option><option value="warn">警告</option><option value="error">错误</option></select><button type="button" id="reload" aria-label="刷新日志" title="刷新日志"></button>
  </div></header>
  <section class="card" aria-label="应用日志内容"><pre id="app-log" class="pre" tabindex="0" aria-label="最近的应用日志">正在读取日志…</pre></section>
</main><script type="module" src="panel.js"></script></body></html>
