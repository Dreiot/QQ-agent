<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的 · QQ Agent</title>
  <link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../visual-refinements.css"></head>
<body data-panel="community">
<main>
  <header class="head">
    <div>
      <div class="eyebrow">MY ACCOUNT</div>
      <h2>我的</h2>
      <div id="meta" class="muted">加载中</div>
    </div>
    <div class="actions">
      <button id="refresh" type="button">刷新</button>
      <button class="ghost" id="open-feedback" type="button">意见收集</button>
    </div>
  </header>
  <p id="community-link-status" class="muted" role="status" aria-live="polite"></p>
  <p id="feedback-status" class="muted" role="status" aria-live="polite"></p>

  <p class="muted">
    社区用于管理发布账号、发布你写的技能/插件和收集意见。
    发布的扩展在 Node 进程内运行，不是代码沙箱，请只发布你检查过的代码。
  </p>

  <nav class="community-links" aria-label="社区链接与帮助">
    <button class="ghost" id="open-market" type="button">市场网页版</button>
    <button class="ghost" id="open-persona-plaza" type="button">人设广场</button>
    <button class="ghost" id="open-feedback-page" type="button">留言板网页版</button>
    <button class="ghost" id="open-site" type="button">打开官网</button>
    <button class="ghost" id="captcha-diagnostics" type="button">验证码诊断</button>
  </nav>

  <!-- 发布账号 -->
  <section class="card" id="pane-account" aria-labelledby="account-heading">
    <h3 id="account-heading">发布账号</h3>
    <div id="account-state" class="muted">未登录</div>
    <div class="grid-2" id="login-form">
      <label>
        <span class="field-title">用户名 / 邮箱</span>
        <input id="login-id" autocomplete="username" placeholder="社区账号">
      </label>
      <label>
        <span class="field-title">密码</span>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="密码">
      </label>
      <label>
        <span class="field-title">显示名称（注册时填写）</span>
        <input id="login-name" autocomplete="nickname" placeholder="展示给别人的名字">
      </label>
      <div class="actions">
        <button id="login" class="primary" type="button">登录</button>
        <button id="register" type="button">注册</button>
        <button id="login-cancel" type="button" hidden>取消登录等待</button>
      </div>
    </div>
    <p id="login-note" class="muted" role="status" aria-live="polite"></p>
  </section>
  <section class="card" id="pane-publish" aria-labelledby="publish-heading">
    <h3 id="publish-heading">发布扩展</h3>
    <div class="grid-2">
      <label>
        <span class="field-title">类型</span>
        <select id="publish-kind" aria-label="发布类型">
          <option value="plugin">插件</option>
          <option value="skill">技能</option>
        </select>
      </label>
      <label>
        <span class="field-title">扩展 id</span>
        <input id="publish-id" placeholder="与目录名/清单 id 一致" autocomplete="off">
      </label>
      <label class="full">
        <span class="field-title">显示名称</span>
        <input id="publish-name" placeholder="留空则用 id" autocomplete="off">
      </label>
      <label class="full">
        <span class="field-title">描述</span>
        <textarea id="publish-desc" placeholder="一句话说明这个扩展做什么"></textarea>
      </label>
    </div>
    <div class="actions">
      <button id="publish" class="primary" type="button">发布</button>
      <button id="publish-cancel" type="button" hidden>取消等待</button>
      <span id="publish-note" class="muted"></span>
    </div>
  </section>

</main>
<script type="module" src="panel.js"></script>
</body>
</html>
