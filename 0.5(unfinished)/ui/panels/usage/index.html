<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用量与成本</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../visual-refinements.css"></head>
<body data-panel="usage"><main class="usage-wrap">
  <header class="head usage-head"><div><h2>用量与成本</h2><p id="status" class="muted" role="status" aria-live="polite">正在读取用量…</p></div><div class="actions">
    <div id="usage-ranges" class="usage-ranges" role="group" aria-label="统计时间范围"><button type="button" data-range="today" aria-pressed="false">今日</button><button type="button" data-range="24h" aria-pressed="false">过去24小时</button><button type="button" data-range="7" aria-pressed="true">近 7 天</button><button type="button" data-range="30" aria-pressed="false">近 30 天</button><button type="button" data-range="all" aria-pressed="false">全部</button></div>
    <select id="range" aria-label="统计时间范围"><option value="today">今日</option><option value="24h">过去24小时</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option><option value="all">全部</option></select><button type="button" id="reload">刷新</button>
  </div></header>
  <section id="metrics" class="metrics" aria-label="用量概览" aria-busy="true"></section>
  <p id="spark-help" class="visually-hidden">趋势图可用左右方向键、Home 和 End 查看各时段数值，移开鼠标或焦点后恢复区间合计。</p>
  <section id="days-block" class="usage-block" aria-labelledby="days-title"><h3 id="days-title">按天</h3><div id="days"></div></section>
  <section class="usage-block" aria-labelledby="chats-title"><h3 id="chats-title">按会话</h3><div id="chats"></div></section>
  <section class="usage-block" aria-labelledby="models-title"><div class="usage-block-head"><h3 id="models-title">按模型</h3><button id="models-expand" type="button" hidden>展开全部</button></div><div id="models"></div></section>
  <details id="advanced-dimensions" class="usage-advanced"><summary>更多统计维度 · 渠道 / 运行会话 / 小时</summary><section class="usage-block"><h3>按渠道</h3><div id="providers"></div></section><section class="usage-block"><h3>按运行会话</h3><div id="sessions"></div></section><section class="usage-block"><h3>按小时</h3><div id="hours"></div></section></details>
</main><script type="module" src="panel.js"></script></body></html>
